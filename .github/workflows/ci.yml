name: CI

on:
  push:
  pull_request:

jobs:
  check-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install PyYAML
      - name: Check skill metadata and examples
        run: python scripts/check.py
